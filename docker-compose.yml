# Proposed production definition. Adya assigned PNEC host port 8630.
# All required variables must be administrator-confirmed before ANY server action.
name: "${PNEC_COMPOSE_PROJECT:?Confirm a dedicated PNEC project; never reuse BEASTS}"
services:
  pnec-api:
    image: "${PNEC_IMAGE:?Set a dedicated reviewed PNEC image tag}"
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - "${PNEC_ENV_FILE:?Set the absolute private production environment file}"
    environment:
      FLASK_ENV: production
      FLASK_PORT: '8630'
      FRONTEND_URL: https://powaynec.opencodingsociety.com
      PNEC_REVIEW_EPHEMERAL: 'false'
      PNEC_DOCKER_DISPOSABLE_TEST: 'false'
    ports:
      - "127.0.0.1:8630:8630"
    volumes:
      - type: bind
        source: "${PNEC_DATA_DIR:?Set the verified absolute persistent PNEC data directory}"
        target: /var/lib/pnec
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
